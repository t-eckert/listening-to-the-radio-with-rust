# https://taskfile.dev
version: '3'
tasks:
  default:
    cmds:
      - task --list-all
    silent: true
  present:
    desc: Run the slide deck with presenterm
    cmds:
      - presenterm slides.md
    silent: true
  rtl-tcp:
    desc: Start the RTL-SDR TCP server
    cmds:
      - rtl_tcp -a 127.0.0.1
    silent: true
  fm:
    desc: Listen to FM radio (set FREQ to your local station in MHz, e.g. 100.3)
    cmds:
      - cargo run -p fm-receiver -- --frequency {{.FREQ | default "100.3"}}
    dir: demos
  fm-stage:
    # Venue-verified 2026-09-09 ON STAGE, antenna seated, long elements.
    # Confirmed by ear at 96.9/38.6: stdev 34.0, peak 59.5/127.5, 0% clipped,
    # against 31.9 / 94.5 for the recorded fm.iq. Gain 40.2 also works but eats
    # headroom (peak 86.5); 36.4 is the floor of usable (25.8).
    #
    # NOT 97.7/3.7 -- that was yesterday's podium spot and it is the noise floor
    # from the stage: rms 0.79 at gain 19.7, 11.29 at 40.2 and that is band
    # noise, not the station. NOT 107.3/19.7 -- measured off-stage, clips.
    #
    # If this fuzzes at a new venue, band-scan before touching hardware; a
    # `[R82XX] PLL not locked!` line prints on EVERY open, working or not, and
    # is not a fault. Scan: step rtl_sdr across 88-108 at gain 40.2, 1 s per
    # step, and measure only the second half of each capture -- a shorter grab
    # is dominated by the tune transient and ranks the band wrong.
    desc: FM exactly as verified at this venue, from the stage
    cmds:
      - "task fm-single FREQ=96.9 GAIN=38.6"
  fm-single:
    desc: Same radio, one file, piped from rtl_sdr (FREQ MHz, GAIN dB). WAV=out.wav to record
    cmds:
      # GAIN default 30, not 40: on the 2 m whip a strong broadcast station rails
      # the ADC at 40 (10.6% of samples clipped, measured 2026-08-16). Montreal is
      # a stronger field than Ottawa, so expect to go lower still at the venue.
      - >-
        rtl_sdr -f $(echo '{{.FREQ | default "97.7"}} * 1000000' | bc | cut -d. -f1) -s 960000 -g {{.GAIN | default "30"}} - | bin/fm-single {{.WAV}}
    dir: demos
    env:
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
    preconditions:
      - sh: test -x bin/fm-single
        msg: "bin/fm-single is missing — run `task alias` before the session, not on stage"
  fm-file:
    desc: Play a recorded IQ file through fm-single, paced and looping (FILE, WAV to record)
    cmds:
      - bin/iq-play {{.FILE | default "fm.iq"}} | bin/fm-single {{.WAV}}
    dir: demos
    preconditions:
      - sh: test -x bin/fm-single
        msg: "bin/fm-single is missing — run `task alias` before the session, not on stage"
      - sh: test -x bin/iq-play
        msg: "bin/iq-play is missing — run `task alias` before the session, not on stage"
      - sh: test -f {{.FILE | default "fm.iq"}}
        msg: "no such IQ file: {{.FILE | default \"fm.iq\"}} — record one with `task capture`"
  capture:
    desc: Record IQ at the fm-single rate (FREQ MHz, SECS, OUT, GAIN dB, DEV index)
    cmds:
      # Check the result with `task capture-check OUT=<file>` before trusting it —
      # a clipped capture is a distorted fallback, and it looks fine as a file size.
      - >-
        rtl_sdr -d {{.DEV | default "0"}} -f $(echo '{{.FREQ | default "106.1"}} * 1000000' | bc | cut -d. -f1) -s 960000 -g {{.GAIN | default "30"}} -n $(echo '{{.SECS | default "10"}} * 960000' | bc | cut -d. -f1) {{.OUT | default "fm.iq"}}
      - ls -lh {{.OUT | default "fm.iq"}}
    dir: demos
    env:
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
  capture-check:
    desc: Report level and clipping for a recorded IQ file (OUT=file.iq)
    cmds:
      - python3 capture-check.py {{.OUT | default "fm.iq"}}
    dir: demos
  am:
    desc: Listen to AM radio (set FREQ in MHz, e.g. 121.5 for aviation)
    cmds:
      - cargo run -p am-receiver -- --frequency {{.FREQ | default "121.5"}}
    dir: demos
  am-single:
    desc: Same AM radio, one file, piped from rtl_sdr (FREQ in MHz). WAV=out.wav to record
    cmds:
      - ""
      # GAIN stays high here: aviation AM is a weak, intermittent signal, the
      # opposite problem to broadcast FM. Do not copy the FM value across.
      - >-
        rtl_sdr -f $(echo '{{.FREQ | default "119.9"}} * 1000000' | bc | cut -d. -f1) -s 960000 -g {{.GAIN | default "40"}} - | bin/am-single {{.WAV}}
    dir: demos
    env:
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
    preconditions:
      - sh: test -x bin/am-single
        msg: "bin/am-single is missing — run `task alias` before the session, not on stage"
  am-file:
    desc: Play a recorded IQ file through am-single, paced and looping (FILE, WAV to record)
    cmds:
      - bin/iq-play {{.FILE | default "atc.iq"}} | bin/am-single {{.WAV}}
    dir: demos
    preconditions:
      - sh: test -x bin/am-single
        msg: "bin/am-single is missing — run `task alias` before the session, not on stage"
      - sh: test -x bin/iq-play
        msg: "bin/iq-play is missing — run `task alias` before the session, not on stage"
      - sh: test -f {{.FILE | default "atc.iq"}}
        msg: "no such IQ file: {{.FILE | default \"atc.iq\"}} — record one with `task capture`"
  fm-remote:
    desc: FM from a remote rtl_tcp — a Pi where the signal is (HOST required, FREQ MHz, GAIN dB)
    cmds:
      # Same pipeline as `fm-single`, with the dongle at the other end of a
      # socket instead of a USB port. `fm-single` is byte-for-byte the file on
      # the slide; it never learns that the samples came over a network.
      - >-
        bin/iq-tcp --host {{.HOST}} --port {{.PORT | default "1234"}} --frequency {{.FREQ | default "97.7"}} --gain {{.GAIN | default "30"}} | bin/fm-single {{.WAV}}
    dir: demos
    preconditions:
      - sh: test -n "{{.HOST}}"
        msg: "set HOST to the remote receiver, e.g. `task fm-remote HOST=radio.local`"
      - sh: test -x bin/iq-tcp
        msg: "bin/iq-tcp is missing — run `task alias` before the session, not on stage"
      - sh: test -x bin/fm-single
        msg: "bin/fm-single is missing — run `task alias` before the session, not on stage"
  am-remote:
    desc: AM from a remote rtl_tcp (HOST required, FREQ MHz, GAIN dB). WAV=out.wav to record
    cmds:
      # GAIN stays high, as in `am-single`: aviation AM is weak and
      # intermittent, the opposite problem to broadcast FM.
      - >-
        bin/iq-tcp --host {{.HOST}} --port {{.PORT | default "1234"}} --frequency {{.FREQ | default "119.9"}} --gain {{.GAIN | default "40"}} | bin/am-single {{.WAV}}
    dir: demos
    preconditions:
      - sh: test -n "{{.HOST}}"
        msg: "set HOST to the remote receiver, e.g. `task am-remote HOST=radio.local`"
      - sh: test -x bin/iq-tcp
        msg: "bin/iq-tcp is missing — run `task alias` before the session, not on stage"
      - sh: test -x bin/am-single
        msg: "bin/am-single is missing — run `task alias` before the session, not on stage"
  link-check:
    desc: Measure whether the network to the remote receiver carries 1.92 MB/s (HOST, SECS)
    cmds:
      # Run this at the venue, on venue infrastructure, before the session.
      # Exits non-zero if the link cannot keep up, so it is a real gate.
      - >-
        bin/iq-tcp --host {{.HOST}} --port {{.PORT | default "1234"}} --frequency {{.FREQ | default "97.7"}} --probe {{.SECS | default "10"}}
    dir: demos
    preconditions:
      - sh: test -n "{{.HOST}}"
        msg: "set HOST to the remote receiver, e.g. `task link-check HOST=radio.local`"
      - sh: test -x bin/iq-tcp
        msg: "bin/iq-tcp is missing — run `task alias` first"
  pi-serve:
    desc: Start rtl_tcp on the remote receiver over ssh (HOST required, USER, GAIN dB)
    cmds:
      # Leave this running in its own terminal. rtl_tcp must bind 0.0.0.0, not
      # its default 127.0.0.1, or it is only reachable from the Pi itself.
      - >-
        ssh {{.USER | default "pi"}}@{{.HOST}} 'rtl_tcp -a 0.0.0.0 -s 960000 -f $(echo "{{.FREQ | default "97.7"}} * 1000000" | bc | cut -d. -f1) -g {{.GAIN | default "30"}}'
    preconditions:
      - sh: test -n "{{.HOST}}"
        msg: "set HOST to the remote receiver, e.g. `task pi-serve HOST=radio.local`"
  fake-pi:
    desc: Rehearse the remote path with no Pi — serves a recorded IQ file as rtl_tcp (FILE)
    cmds:
      # Not for stage use. This exists so `task fm-remote HOST=127.0.0.1` can be
      # rehearsed, and tested, on a laptop with no hardware in the room.
      - bin/rtl-tcp-fake {{.FILE | default "fm.iq"}} --bind {{.BIND | default "127.0.0.1:1234"}}
    dir: demos
    preconditions:
      - sh: test -x bin/rtl-tcp-fake
        msg: "bin/rtl-tcp-fake is missing — run `task alias` first"
  adsb:
    desc: Decode ADS-B aircraft signals at 1090 MHz
    cmds:
      - cargo run -p adsb-decoder
    dir: demos
  tracker:
    desc: Show tracked aircraft on a map (run adsb task first). REGION=ottawa|montreal
    cmds:
      - cargo run -p flight-tracker -- --region {{.REGION}}
    dir: demos
    vars:
      REGION: '{{.REGION | default "montreal"}}'
  adsb-api:
    desc: Serve tracked aircraft over HTTP as JSON (run adsb task first)
    cmds:
      - cargo run -p adsb-api -- --bind {{.BIND | default "0.0.0.0:8080"}}
    dir: demos
  iq-print:
    desc: Print raw IQ samples from the SDR
    cmds:
      - cargo run -p iq-print -- --frequency {{.FREQ | default "100.3"}}
    dir: demos
  wave:
    desc: Visualize EM wave propagation (no hardware needed)
    cmds:
      - cargo run -p wave-demo
    dir: demos
  iq:
    desc: Interactive IQ complex plane visualization (no hardware needed)
    cmds:
      - cargo run -p iq-demo
    dir: demos
  build:
    desc: Build all demos
    cmds:
      - cargo build --release
    dir: demos
  alias:
    desc: Symlink release binaries to short names in demos/bin/
    deps: [build]
    cmds:
      - mkdir -p bin
      - ln -sf ../target/release/wave-demo bin/wave
      - ln -sf ../target/release/iq-demo bin/iq
      - ln -sf ../target/release/iq-print bin/iq-print
      - ln -sf ../target/release/fm-receiver bin/fm
      - ln -sf ../target/release/am-receiver bin/am
      - ln -sf ../target/release/fm-single bin/fm-single
      - ln -sf ../target/release/am-single bin/am-single
      - ln -sf ../target/release/iq-play bin/iq-play
      - ln -sf ../target/release/iq-tcp bin/iq-tcp
      - ln -sf ../target/release/rtl-tcp-fake bin/rtl-tcp-fake
      - ln -sf ../target/release/adsb-decoder bin/adsb
      - ln -sf ../target/release/flight-tracker bin/tracker
      - ln -sf ../target/release/adsb-api bin/adsb-api
      - echo "Binaries linked in demos/bin/"
    dir: demos
